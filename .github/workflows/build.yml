name: build

on:
  push:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Ubuntu 24.04 blocks the unprivileged user namespaces Chromium's sandbox needs, so the shared-browser
      # tests' Chromium would crash at start. This only changes the test machine, not LinuxAI.
      - name: Let Chromium's sandbox run (for the browser tests)
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      - name: Core (Rust) tests
        run: cd core && cargo test --locked && cargo build --release --locked
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: AI layer (Python) tests
        run: pip install -e . pytest && pytest -q

  # Known vulnerabilities in dependencies: a reported vulnerability fails the build. "Unmaintained" notices
  # (chrono, chrono-tz today) are warnings, printed but not failing.
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - name: Rust dependencies (RustSec advisories)
        run: cd core && cargo audit
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Python dependencies (PyPI advisories)
        run: pip install pip-audit && pip-audit .

  iso:
    needs: [test, audit]
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
      options: --privileged
    steps:
      - uses: actions/checkout@v4
      - name: Build the LinuxAI ISO
        run: SRC="$GITHUB_WORKSPACE" OUT="$GITHUB_WORKSPACE/out" WORK=/tmp/work bash image/build-in-arch.sh
      - uses: actions/upload-artifact@v4
        with:
          name: linuxai-iso
          path: out/*.iso
          retention-days: 14
          compression-level: 0
