<title>LinuxAI Workspace</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Space+Grotesk:wght@500;600&display=swap">
<style>
/* Layout: a cockpit. Stream of work (left) · the reasoning graph of the selected task (center) ·
   inspector + discussion for the selected step (right). Stacks to one column on phones.
   Deliberately dark-only: it is the OS's own screen, one visual world. */
:root {
  color-scheme: dark;
  --bg: #0b1016;          /* deep slate, faintly blue */
  --panel: #111821;
  --panel-2: #16202b;
  --line: #233140;
  --line-soft: #1b2733;
  --fg: #dfe7ee;
  --fg-dim: #8ea0b1;
  --fg-faint: #5d6f80;
  --accent: #46c2c9;      /* the AI's color: teal */
  --accent-soft: rgba(70,194,201,.14);
  --you: #e8b04a;         /* the human's color: amber. Also "needs you" */
  --you-soft: rgba(232,176,74,.14);
  --ok: #6fbf8e;
  --bad: #e06c6c;
  --font-display: "Space Grotesk", "IBM Plex Sans", system-ui, sans-serif;
  --font-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
html, body { height: 100%; }
body { background: var(--bg); color: var(--fg); font: 14px/1.5 var(--font-body); }
* { box-sizing: border-box; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, textarea:focus-visible, .node:focus-visible, .task:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.app { height: 100%; display: grid; grid-template-rows: auto 1fr; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 12px; gap: 12px; }
.top { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
.brand { font: 600 18px/1 var(--font-display); letter-spacing: .02em; }
.brand span { color: var(--accent); }
.vitals { display: flex; gap: 8px; flex-wrap: wrap; font: 12px/1 var(--font-mono); color: var(--fg-dim); }
.vital { border: 1px solid var(--line); border-radius: 999px; padding: 6px 10px; display: inline-flex; gap: 6px; align-items: center; }
.vital b { color: var(--fg); font-weight: 500; }
.dot { width: 7px; height: 7px; border-radius: 50%; background: var(--ok); }
.dot.you { background: var(--you); }
.mode { margin-left: auto; font: 12px var(--font-mono); color: var(--fg-faint); }

.main { min-height: 0; display: grid; grid-template-columns: minmax(230px, 280px) minmax(0, 1fr) minmax(300px, 380px); gap: 12px; }
.panel { background: var(--panel); border: 1px solid var(--line-soft); border-radius: 10px; min-height: 0; display: flex; flex-direction: column; }
.panel-h { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; padding: 12px 14px 8px; }
.label { font: 500 11px/1.2 var(--font-mono); letter-spacing: .1em; text-transform: uppercase; color: var(--fg-faint); }
.scroll { overflow: auto; min-height: 0; }

/* Stream */
.stream { padding: 0 8px 10px; display: flex; flex-direction: column; gap: 6px; }
.task { text-align: left; background: transparent; border: 1px solid transparent; border-radius: 8px; padding: 10px; display: grid; gap: 4px; }
.task:hover { background: var(--panel-2); }
.task.on { background: var(--panel-2); border-color: var(--line); }
.task-t { font-weight: 500; line-height: 1.3; }
.task-m { display: flex; gap: 8px; align-items: center; font: 12px var(--font-mono); color: var(--fg-dim); flex-wrap: wrap; }
.pill { font: 500 10.5px/1 var(--font-mono); letter-spacing: .06em; text-transform: uppercase; padding: 4px 7px; border-radius: 4px; border: 1px solid currentColor; white-space: nowrap; }
.s-done { color: var(--ok); } .s-running { color: var(--accent); } .s-waiting, .s-stale, .s-proposed { color: var(--you); } .s-failed { color: var(--bad); }
.src { color: var(--fg-faint); }
.group-l { padding: 10px 10px 2px; }

/* Graph */
.graph-wrap { position: relative; overflow: auto; flex: 1; min-height: 320px; }
.graph { position: relative; }
.graph svg { position: absolute; inset: 0; pointer-events: none; overflow: visible; }
.cols { position: absolute; top: 0; left: 0; display: flex; font: 500 10.5px var(--font-mono); letter-spacing: .1em; text-transform: uppercase; color: var(--fg-faint); }
.node { position: absolute; width: 190px; text-align: left; background: var(--panel-2); border: 1px solid var(--line); border-radius: 8px; padding: 9px 10px; display: grid; gap: 5px; transition: border-color .15s, box-shadow .15s, opacity .15s; }
.node:hover { border-color: var(--fg-faint); }
.node.on { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.node.k-intent { border-left: 3px solid var(--you); }
.node.st-stale, .node.st-proposed { border-style: dashed; border-color: var(--you); }
.node.st-waiting { border-color: var(--you); background: linear-gradient(var(--you-soft), var(--you-soft)), var(--panel-2); }
.node.impact { box-shadow: 0 0 0 3px var(--you-soft); border-color: var(--you); }
.node.dim { opacity: .45; }
.node-k { display: flex; justify-content: space-between; gap: 6px; font: 500 10px/1 var(--font-mono); letter-spacing: .09em; text-transform: uppercase; color: var(--fg-faint); }
.node-t { font-weight: 500; font-size: 13px; line-height: 1.3; }
.node-m { display: flex; gap: 8px; align-items: center; font: 11px var(--font-mono); color: var(--fg-dim); }
.conf { font-variant-numeric: tabular-nums; }
.cmt-n { color: var(--you); }
.legend { display: flex; gap: 14px; flex-wrap: wrap; padding: 8px 14px 12px; font: 11px var(--font-mono); color: var(--fg-faint); border-top: 1px solid var(--line-soft); }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; vertical-align: -1px; margin-right: 5px; border: 1px solid var(--line); }

/* Inspector */
.insp { padding: 4px 14px 14px; display: flex; flex-direction: column; gap: 14px; }
.insp h2 { font: 600 19px/1.25 var(--font-display); margin: 4px 0 0; text-wrap: balance; }
.meta { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; font: 12px var(--font-mono); color: var(--fg-dim); }
.sec { display: grid; gap: 6px; }
.sec p { margin: 0; }
.why li, .evid li { margin: 2px 0; }
.why, .evid { margin: 0; padding-left: 18px; }
.evid { list-style: none; padding: 0; display: grid; gap: 4px; }
.evid li { font-size: 13px; color: var(--fg-dim); }
.chip { font: 11px var(--font-mono); color: var(--fg-dim); border: 1px solid var(--line); border-radius: 4px; padding: 1px 5px; margin-right: 6px; }
.opts { display: grid; gap: 6px; }
.opt { border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; display: grid; gap: 5px; }
.opt.chosen { border-color: var(--accent); }
.opt-top { display: flex; justify-content: space-between; gap: 8px; font-weight: 500; }
.bar { height: 4px; background: var(--line-soft); border-radius: 2px; overflow: hidden; }
.bar > span { display: block; height: 100%; background: var(--fg-faint); }
.opt.chosen .bar > span { background: var(--accent); }
.opt-why { font-size: 12.5px; color: var(--fg-dim); }
.links { display: flex; gap: 6px; flex-wrap: wrap; }
.link { background: none; border: 1px solid var(--line); border-radius: 6px; padding: 3px 8px; font-size: 12.5px; color: var(--fg-dim); }
.link:hover { color: var(--fg); border-color: var(--fg-faint); }
details summary { cursor: pointer; font: 12px var(--font-mono); color: var(--fg-dim); }
pre { margin: 6px 0 0; padding: 10px; background: var(--bg); border: 1px solid var(--line-soft); border-radius: 6px; font: 12px/1.45 var(--font-mono); color: var(--fg-dim); overflow-x: auto; white-space: pre; }
.actions-row { display: flex; gap: 8px; flex-wrap: wrap; }
.btn { border: 1px solid var(--line); background: var(--panel-2); border-radius: 7px; padding: 7px 12px; font-weight: 500; }
.btn:hover { border-color: var(--fg-faint); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #06231f; }
.btn.amber { background: var(--you); border-color: var(--you); color: #2a1c02; }
.btn:disabled { opacity: .5; cursor: default; }
.history { font-size: 12.5px; color: var(--fg-faint); display: grid; gap: 4px; }
.history s { color: var(--fg-faint); }

.thread { display: grid; gap: 8px; }
.msg { display: grid; gap: 2px; }
.msg-w { font: 500 11px var(--font-mono); letter-spacing: .06em; text-transform: uppercase; }
.msg.you .msg-w { color: var(--you); } .msg.ai .msg-w { color: var(--accent); }
.msg p { margin: 0; white-space: pre-wrap; }
.composer { display: grid; gap: 8px; }
.composer textarea { width: 100%; min-height: 64px; resize: vertical; background: var(--bg); color: var(--fg); border: 1px solid var(--line); border-radius: 8px; padding: 9px 10px; font: inherit; }
.hint { font-size: 12px; color: var(--fg-faint); }
.impact-box { border: 1px dashed var(--you); border-radius: 8px; padding: 10px; display: grid; gap: 8px; background: var(--you-soft); }
.impact-box h3 { margin: 0; font: 600 14px var(--font-display); color: var(--you); }
.chg { display: grid; gap: 2px; font-size: 13px; }
.chg b { font-weight: 600; }
.chg .old { color: var(--fg-faint); text-decoration: line-through; }
.sms { background: var(--bg); border: 1px solid var(--line); border-radius: 14px 14px 14px 4px; padding: 10px 12px; font-size: 13.5px; white-space: pre-wrap; }
.reach-m { font: 11.5px var(--font-mono); color: var(--fg-dim); display: grid; gap: 2px; }
.meanwhile { margin: 0; padding-left: 18px; color: var(--fg-dim); font-size: 13px; }
.task-why { font-size: 12.5px; color: var(--fg-dim); line-height: 1.35; }
.prin { display: grid; gap: 6px; padding: 0 10px 12px; }
.prin-i { border-left: 2px solid var(--you); padding: 2px 0 2px 9px; display: grid; gap: 1px; }
.prin-i span { font-size: 13px; line-height: 1.35; }
.prin-i small { font: 11px var(--font-mono); color: var(--fg-faint); }
.prin-i.new { background: var(--you-soft); }
.applied { display: grid; gap: 4px; }
.applied span { font-size: 13px; color: var(--fg-dim); border-left: 2px solid var(--you); padding-left: 8px; }
.lesson { display: grid; gap: 6px; border-top: 1px solid rgba(232,176,74,.35); padding-top: 8px; }
.lesson label { display: flex; gap: 8px; align-items: flex-start; font-size: 13px; }
.thinking { color: var(--accent); font: 12px var(--font-mono); }
@media (prefers-reduced-motion: no-preference) {
  .thinking::after { content: " ●"; animation: blink 1s infinite; }
  @keyframes blink { 50% { opacity: .2; } }
}

@media (max-width: 1060px) {
  .main { grid-template-columns: minmax(0, 1fr); grid-auto-rows: auto; }
  .app { height: auto; }
  html, body { height: auto; }
  .panel.stream-p .scroll { max-height: 240px; }
  .graph-wrap { min-height: 380px; max-height: 70vh; }
  .mode { margin-left: 0; }
}
</style>

<div class="app">
  <header class="top">
    <div class="brand">Linux<span>AI</span></div>
    <div class="vitals" aria-label="Machine status">
      <span class="vital"><span class="dot"></span>core <b>running</b></span>
      <span class="vital">power <b>on battery · 64% · saver</b></span>
      <span class="vital">cpu policy <b>efficiency</b></span>
      <span class="vital"><span class="dot you"></span><b id="waitingCount">2</b> undecided · you've been texted</span>
    </div>
    <div class="mode" id="mode">prototype · example data</div>
  </header>

  <main class="main">
    <section class="panel stream-p" aria-label="Work stream">
      <div class="panel-h"><span class="label">Stream</span><span class="label" id="streamCount"></span></div>
      <div class="scroll"><div class="stream" id="stream"></div></div>
    </section>

    <section class="panel" aria-label="Reasoning graph">
      <div class="panel-h"><span class="label" id="graphTitle">Reasoning</span><span class="label" id="graphMeta"></span></div>
      <div class="graph-wrap" id="graphWrap"><div class="graph" id="graph"></div></div>
      <div class="legend">
        <span><i style="border-left:3px solid var(--you)"></i>your intent</span>
        <span><i style="border-color:var(--accent)"></i>selected</span>
        <span><i style="border:1px dashed var(--you)"></i>changed by a comment · not applied</span>
        <span><i style="background:var(--you-soft);border-color:var(--you)"></i>waiting for you</span>
      </div>
    </section>

    <section class="panel" aria-label="Inspector">
      <div class="panel-h"><span class="label" id="inspLabel">Step</span></div>
      <div class="scroll"><div class="insp" id="insp"></div></div>
    </section>
  </main>
</div>

<script>
// ---------------------------------------------------------------------------------------------
// Example data. Every task is a small graph: intent → reasoning → decisions → actions → results.
// ---------------------------------------------------------------------------------------------
const KINDS = ["intent", "reasoning", "decision", "action", "result"];
const KIND_LABEL = { intent: "Intent", reasoning: "Reasoning", decision: "Decision", action: "Action", result: "Result" };

// What the AI has learned from the human: ways to think, applied to future decisions.
let principles = [
  { id: "p1", text: "Don't haul loaded miles under $2.40/mi.", scope: "freight", from: "You set this in September", uses: 23 },
  { id: "p2", text: "Going under the floor is OK when the load gets the truck home for the weekend with little deadhead.", scope: "freight", from: "Your comment on a Memphis load, Oct 18", uses: 4 },
  { id: "p3", text: "Never book Frontier.", scope: "travel", from: "Your text, Mar 3", uses: 2 },
  { id: "p4", text: "Ask before paying a bill more than 20% above its usual amount.", scope: "bills", from: "You set this Oct 4", uses: 1 },
];

let tasks = [
  {
    id: "load", title: "Negotiating a Dallas → Atlanta load", source: "broker · email + call", when: "10:31", status: "waiting",
    nodes: [
      { id: "i1", kind: "intent", author: "you", status: "done", title: "Standing direction: keep the truck loaded at $2.40+/mi",
        summary: "You said to find loads and negotiate within your rate rules, and to call you in only when it matters.", applied: ["p1", "p2"], parents: [] },
      { id: "r1", kind: "reasoning", author: "ai", status: "done", title: "Truck empties in Dallas Friday 2pm", conf: 0.96,
        summary: "Delivery in Dallas is confirmed for Friday at 2pm. Your driver lives in Atlanta and is off Saturday and Sunday.",
        evidence: [["rate con", "Load #DL-4471 delivery, Fri 2pm"], ["calendar", "Driver home time, Sat–Sun"]], parents: ["i1"] },
      { id: "r2", kind: "reasoning", author: "ai", status: "done", title: "Lane is soft: market ~$2.21/mi", conf: 0.78,
        summary: "Dallas → Atlanta (781 mi) has averaged $2.21/mi over the last 2 weeks, and it's Friday afternoon, when outbound Dallas freight thins out.",
        evidence: [["load board", "14 posted DAL→ATL loads, $2.05–$2.38/mi"], ["memory", "Your last 6 loads on this lane"]], parents: ["i1"] },
      { id: "r3", kind: "reasoning", author: "ai", status: "done", title: "Broker offered $1,640 ($2.10/mi)", conf: 0.99,
        summary: "Hollis Logistics: dry van, 42,000 lb, pickup Friday 4pm 6 miles from your delivery, drop Monday 8am in Atlanta.",
        evidence: [["email", "Offer from Dana at Hollis Logistics, 10:31"]], parents: ["i1"] },
      { id: "d1", kind: "decision", author: "ai", status: "done", title: "Counter at $1,950 ($2.50/mi)", conf: 0.74,
        summary: "Start above your floor. Hollis has posted this load twice, so they're likely short on trucks.",
        options: [
          { label: "Counter $1,950 ($2.50/mi)", score: 0.74, chosen: true, why: "Room to come down; the load was reposted, which suggests the broker needs a truck." },
          { label: "Counter $1,875 ($2.40/mi, your floor)", score: 0.51, why: "Leaves no room to negotiate." },
          { label: "Decline and search for other loads", score: 0.18, why: "Few better options this late on a Friday." } ],
        applied: ["p1"], parents: ["r2", "r3"] },
      { id: "a1", kind: "action", author: "ai", status: "done", title: "Countered by email at $1,950",
        summary: "“We can cover it at $1,950 all in. The truck is empty 6 miles away at 2pm.”",
        raw: { do: "reply", to: "@dana-hollis", saying: "We can cover it at $1,950 all in…", within: "mandate:freight" }, parents: ["d1"] },
      { id: "r4", kind: "reasoning", author: "ai", status: "done", title: "Broker came back at $1,780 ($2.28/mi)", conf: 0.99,

        summary: "This matches your weekend-home exception: 6 miles of deadhead, and the driver is home Saturday. My confidence is lower because $2.28 is further under the floor than you've taken before ($2.34 was the lowest), so I'm asking.",
        options: [
          { label: "Accept $1,780", score: 0.66, chosen: true, why: "Truck home for the weekend, almost no deadhead. Beats driving home empty, which costs about $640 in fuel and time." },

          { label: "Deadhead home empty", score: 0.12, why: "No revenue and about $640 in cost." } ],

      { id: "d2", kind: "decision", author: "ai", status: "done", title: "Southwest 1432, 8:05am, $214 round trip", conf: 0.77,

        options: [
          { label: "Southwest 1432 · 8:05am · $214", score: 0.77, chosen: true, why: "Usual airline, aisle available, 2 free bags." },
          { label: "United 512 · 6:10am · $189", score: 0.44, why: "Cheaper, but you've rebooked away from early flights 3 times." },
          { label: "Frontier 2207 · 11:40am · $121", score: 0.08, why: "You said never again; bag fees bring it to about $190." } ],
        applied: ["p3"], parents: ["d1", "r2"] },
      { id: "d3", kind: "decision", author: "ai", status: "done", title: "Courtyard Downtown, 3 nights, $504", conf: 0.71,

      { id: "a2", kind: "action", author: "ai", status: "waiting", title: "Book flights + hotel ($718)",

        reach: { sent: "9:20", channel: "text", reminder: "5:00pm", deadline: "tomorrow 9:00am (when the seat hold expires)", fallback: "Release the hold and tell you",

// ---------------------------------------------------------------------------------------------
// State
// ---------------------------------------------------------------------------------------------
let current = tasks[0].id;
let selected = "d2";
let pending = null;       // {taskId, nodeId, comment, result: {kind, reply, remember, revisions[]}}
let thinking = null;      // {nodeId, ctl}
let sampleFn = null;      // Claude, when this view allows it

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const task = () => tasks.find((t) => t.id === current);
const node = (t, id) => t.nodes.find((n) => n.id === id);
const children = (t, id) => t.nodes.filter((n) => n.parents.includes(id));
function reach(t, id, dir) {
  const seen = new Set(), stack = [id];
  while (stack.length) {
    const cur = stack.pop();
    const next = dir === "down" ? children(t, cur).map((n) => n.id) : node(t, cur).parents;
    for (const n of next) if (!seen.has(n)) { seen.add(n); stack.push(n); }
  }
  return [...seen];
}
const pct = (x) => (x == null ? "" : Math.round(x * 100) + "%");
const statusWord = { done: "done", running: "running", waiting: "undecided", stale: "out of date", proposed: "proposed", failed: "failed" };

// ---------------------------------------------------------------------------------------------
// Render: stream
// ---------------------------------------------------------------------------------------------
function renderStream() {
  const waiting = tasks.filter((t) => t.status === "waiting");
  const rest = tasks.filter((t) => t.status !== "waiting");
  const reachOf = (t) => t.nodes.find((n) => n.reach && n.status === "waiting")?.reach;
  const item = (t) => `
    <button class="task ${t.id === current ? "on" : ""}" data-task="${t.id}">
      <span class="task-t">${esc(t.title)}</span>
      ${t.status === "waiting" && reachOf(t) ? `<span class="task-why">${esc(reachOf(t).why)}</span>` : ""}
      <span class="task-m"><span class="pill s-${t.status}">${statusWord[t.status]}</span><span class="src">${t.status === "waiting" && reachOf(t) ? `texted you ${esc(reachOf(t).sent)}` : `${esc(t.source)} · ${esc(t.when)}`}</span></span>
    </button>`;
  $("stream").innerHTML =
    (waiting.length ? `<div class="label group-l">Undecided · I've reached you</div>${waiting.map(item).join("")}` : "") +
    `<div class="label group-l">Recent</div>${rest.map(item).join("")}` +
    `<div class="label group-l" style="margin-top:8px">Learned from you</div><div class="prin">${principles.map((p) =>
      `<div class="prin-i ${p.isNew ? "new" : ""}"><span>${esc(p.text)}</span><small>${esc(p.scope)} · ${esc(p.from)}${p.uses ? ` · used ${p.uses}×` : ""}</small></div>`).join("")}</div>`;
  $("waitingCount").textContent = waiting.length;
  $("streamCount").textContent = tasks.length + " tasks";
}

// ---------------------------------------------------------------------------------------------
// Render: graph (columns by kind, edges as curves)
// ---------------------------------------------------------------------------------------------
const COL_W = 226, NODE_W = 190, ROW_H = 100, TOP = 8;
// Columns follow dependency depth, so every arrow points right; rows are ordered by their parents' rows.
function layout(t) {
  const depth = {};
  const d = (n) => depth[n.id] ??= n.parents.length ? 1 + Math.max(...n.parents.map((p) => d(node(t, p)))) : 0;
  t.nodes.forEach(d);
  const ncols = Math.max(...Object.values(depth)) + 1, pos = {}, row = {};
  for (let c = 0; c < ncols; c++) {
    const col = t.nodes.filter((n) => depth[n.id] === c);
    const key = (n) => n.parents.length ? n.parents.reduce((s, p) => s + (row[p] ?? 0), 0) / n.parents.length : 0;
    col.map((n, i) => [n, key(n) + i * 1e-3]).sort((a, b) => a[1] - b[1]).forEach(([n], i) => {
      row[n.id] = i; pos[n.id] = { x: 8 + c * COL_W, y: TOP + i * ROW_H };
    });
  }
  return { cols: Array.from({ length: ncols }), pos };
}

function renderGraph() {
  const t = task();
  const { cols, pos } = layout(t);
  const impact = new Set(pending && pending.taskId === t.id ? pending.result.revisions.map((r) => r.id) : []);
  const focus = new Set([selected, ...reach(t, selected, "up"), ...reach(t, selected, "down")]);
  const w = 8 + cols.length * COL_W, h = Math.max(...Object.values(pos).map((p) => p.y)) + ROW_H;
  let edges = "";
  for (const n of t.nodes) for (const p of n.parents) {
    const a = pos[p], b = pos[n.id]; if (!a || !b) continue;
    const x1 = a.x + NODE_W, y1 = a.y + 34, x2 = b.x, y2 = b.y + 34, mx = (x1 + x2) / 2;
    const lit = focus.has(n.id) && focus.has(p);
    edges += `<path d="M${x1},${y1} C${mx},${y1} ${mx},${y2} ${x2},${y2}" fill="none" stroke="${lit ? "var(--accent)" : "var(--line)"}" stroke-width="${lit ? 1.6 : 1.2}" opacity="${lit ? 0.9 : 0.8}"/>`;
  }
  const nodes = t.nodes.map((n) => {
    const p = pos[n.id];
    const st = impact.has(n.id) ? "proposed" : n.status;
    const meta = [n.conf != null ? `<span class="conf">${pct(n.conf)} sure</span>` : "", n.comments?.length ? `<span class="cmt-n">${n.comments.length} comment${n.comments.length > 1 ? "s" : ""}</span>` : ""].join("");
    return `<button class="node k-${n.kind} st-${st} ${n.id === selected ? "on" : ""} ${impact.has(n.id) ? "impact" : ""} ${focus.has(n.id) ? "" : "dim"}"
        style="left:${p.x}px;top:${p.y}px" data-node="${n.id}" aria-label="${esc(KIND_LABEL[n.kind] + ": " + n.title)}">
      <span class="node-k"><span>${KIND_LABEL[n.kind]}${n.author === "you" ? " · you" : n.author === "rule" ? " · rule" : ""}</span><span class="s-${st}">${statusWord[st]}</span></span>
      <span class="node-t">${esc(n.title)}</span>
      ${meta ? `<span class="node-m">${meta}</span>` : ""}
    </button>`;
  }).join("");
  $("graph").style.width = w + "px"; $("graph").style.height = h + "px";
  $("graph").innerHTML = `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}">${edges}</svg>${nodes}`;
  const sp = pos[selected], wrap = $("graphWrap");
  if (sp && (sp.x < wrap.scrollLeft || sp.x + NODE_W > wrap.scrollLeft + wrap.clientWidth)) wrap.scrollLeft = Math.max(0, sp.x - wrap.clientWidth / 2 + NODE_W / 2);
  $("graphTitle").textContent = t.title;
  $("graphMeta").textContent = t.source;
}

// ---------------------------------------------------------------------------------------------
// Render: inspector
// ---------------------------------------------------------------------------------------------
function renderInspector() {
  const t = task(), n = node(t, selected);
  if (!n) { $("insp").innerHTML = ""; return; }
  $("inspLabel").textContent = KIND_LABEL[n.kind];
  const ups = n.parents.map((id) => node(t, id)), downs = children(t, n.id);
  const linkList = (list) => list.map((x) => `<button class="link" data-node="${x.id}">${esc(x.title)}</button>`).join("");
  let html = `
    <div>
      <div class="meta"><span class="pill s-${n.status}">${statusWord[n.status]}</span><span>${n.author === "you" ? "from you" : n.author === "rule" ? "by a rule" : "by the AI"}</span>${n.conf != null ? `<span class="conf">${pct(n.conf)} sure</span>` : ""}</div>
      <h2>${esc(n.title)}</h2>
    </div>
    <div class="sec"><p>${esc(n.summary)}</p></div>`;
  if (n.evidence?.length) html += `<div class="sec"><div class="label">Based on</div><ul class="evid">${n.evidence.map(([k, v]) => `<li><span class="chip">${esc(k)}</span>${esc(v)}</li>`).join("")}</ul></div>`;
  if (n.applied?.length) html += `<div class="sec"><div class="label">Your principles it applied</div><div class="applied">${n.applied.map((id) => principles.find((p) => p.id === id)).filter(Boolean).map((p) => `<span>${esc(p.text)}</span>`).join("")}</div></div>`;
  if (n.options?.length) html += `<div class="sec"><div class="label">Options weighed</div><div class="opts">${n.options.map((o) => `
      <div class="opt ${o.chosen ? "chosen" : ""}">
        <div class="opt-top"><span>${o.chosen ? "✓ " : ""}${esc(o.label)}</span><span class="conf">${pct(o.score)}</span></div>
        <div class="bar"><span style="width:${Math.round((o.score || 0) * 100)}%"></span></div>
        <div class="opt-why">${esc(o.why)}</div>
      </div>`).join("")}</div></div>`;
  if (n.raw) html += `<details class="sec"><summary>What runs behind the scenes (LinuxAI action language)</summary><pre>${esc(JSON.stringify(n.raw, null, 2))}</pre></details>`;
  if (n.reach && n.status === "waiting") {
    const r = n.reach;
    const msg = `LinuxAI needs you: ${n.title}\nWhy I'm unsure: ${r.why}\nI'd lean: ${r.lean}\nReply: ${r.opts.join(" / ")}\nIf I don't hear back by ${r.deadline}, I'll ${r.fallback.replace(/^./, (c) => c.toLowerCase())}.`;
    html += `<div class="sec"><div class="label">Sent to you by ${esc(r.channel)} · ${esc(r.sent)}</div><div class="sms">${esc(msg)}</div>
      <div class="reach-m"><span>follow-up: ${esc(r.reminder)}</span><span>if no answer by ${esc(r.deadline)}: ${esc(r.fallback)}</span></div>
      <div class="label" style="margin-top:4px">Reply (same as replying to the text)</div>
      <div class="actions-row">${r.opts.map((o, i) => `<button class="btn ${i === 0 ? "amber" : ""}" data-reply="${n.id}" data-i="${i}">${esc(o)}</button>`).join("")}</div>
      ${r.meanwhile?.length ? `<div class="label" style="margin-top:4px">Still working on, meanwhile</div><ul class="meanwhile">${r.meanwhile.map((m) => `<li>${esc(m)}</li>`).join("")}</ul>` : ""}
    </div>`;
  } else if (n.status === "waiting" && n.kind === "action") html += `<div class="actions-row"><button class="btn amber" data-approve="${n.id}">Approve</button><button class="btn" data-decline="${n.id}">Not now</button></div>`;
  if (ups.length || downs.length) html += `<div class="sec">${ups.length ? `<div class="label">Comes from</div><div class="links">${linkList(ups)}</div>` : ""}${downs.length ? `<div class="label" style="margin-top:6px">Leads to</div><div class="links">${linkList(downs)}</div>` : ""}</div>`;
  if (n.history?.length) html += `<div class="sec"><div class="label">Earlier versions</div><div class="history">${n.history.map((h) => `<span><s>${esc(h.title)}</s> · changed after: “${esc(h.after)}”</span>`).join("")}</div></div>`;

  // Discussion
  const msgs = (n.comments || []).map((c) => `<div class="msg ${c.who}"><span class="msg-w">${c.who === "you" ? "You" : "AI"}</span><p>${esc(c.text)}</p></div>`).join("");
  html += `<div class="sec"><div class="label">Discussion</div><div class="thread">${msgs || `<span class="hint">Ask why, correct a fact, or change a choice. The AI works out what your comment changes before and after this step.</span>`}</div></div>`;
  if (thinking && thinking.nodeId === n.id && current === thinking.taskId) {
    html += `<div class="actions-row"><span class="thinking">Re-evaluating with your comment</span><button class="btn" id="stop">Stop</button></div>`;
  }
  if (pending && pending.taskId === t.id && pending.nodeId === n.id) html += impactBox(t);
  html += `
    <form class="composer" id="composer">
      <label class="label" for="cmt">Comment on this step</label>
      <textarea id="cmt" placeholder="${esc(placeholderFor(n))}" ${thinking ? "disabled" : ""}></textarea>
      <div class="actions-row"><button class="btn primary" type="submit" ${thinking ? "disabled" : ""}>Send</button><span class="hint">${sampleFn ? "Claude re-reasons live" : "Scripted demo (Claude not available here)"}</span></div>
    </form>`;
  $("insp").innerHTML = html;
}

function placeholderFor(n) {
  return { intent: "e.g. Actually it's a work trip, so expense it", reasoning: "e.g. The rehearsal dinner moved to Thursday",
    decision: "e.g. Also weigh that Hollis pays in 2 days, not 30", action: "e.g. Why not hold the hotel too?", result: "e.g. That's too expensive" }[n.kind];
}

function impactBox(t) {
  const r = pending.result;
  const rows = r.revisions.map((rv) => {
    const n = node(t, rv.id); if (!n) return "";
    const changedTitle = rv.title && rv.title !== n.title;
    return `<div class="chg"><span class="label">${KIND_LABEL[n.kind]}</span>${changedTitle ? `<span class="old">${esc(n.title)}</span><b>${esc(rv.title)}</b>` : `<b>${esc(n.title)}</b>`}<span>${esc(rv.why || rv.summary || "")}</span></div>`;
  }).join("");
  const up = r.revisions.filter((rv) => reach(t, pending.nodeId, "up").includes(rv.id)).length;
  const down = r.revisions.filter((rv) => reach(t, pending.nodeId, "down").includes(rv.id)).length;
  return `<div class="impact-box">
      <h3>${r.revisions.length ? `Your comment changes ${r.revisions.length} step${r.revisions.length === 1 ? "" : "s"}` : "Your comment teaches a way to think"}</h3>
      <span class="hint">${up ? `${up} before this step · ` : ""}${down} after it · nothing has been applied yet</span>
      ${rows}
      ${r.principle?.text ? `<div class="lesson"><span class="label" style="color:var(--you)">A way of thinking to keep</span><span>“${esc(r.principle.text)}”</span>
        <label><input type="checkbox" id="keepLesson" checked> From now on, for ${esc(r.principle.scope || "similar decisions")} (untick for just this time)</label></div>` : ""}
      <div class="actions-row"><button class="btn amber" id="apply">Apply changes</button><button class="btn" id="branch">Keep both (branch)</button><button class="btn" id="discard">Discard</button></div>
    </div>`;
}

function render() { renderStream(); renderGraph(); renderInspector(); }

// ---------------------------------------------------------------------------------------------
// Comments → re-evaluation (Claude when available; a scripted fallback otherwise)
// ---------------------------------------------------------------------------------------------
function compactTask(t) {
  return { task: t.title, nodes: t.nodes.map((n) => ({ id: n.id, kind: n.kind, author: n.author, status: n.status, title: n.title,
    summary: n.summary, confidence: n.conf, from: n.parents, options: n.options?.map((o) => ({ label: o.label, score: o.score, chosen: !!o.chosen })),
    evidence: n.evidence?.map(([k, v]) => k + ": " + v), applied_principles: n.applied?.map((id) => principles.find((p) => p.id === id)?.text) })) };
}

function promptFor(t, n, comment) {
  return `You are the reasoning layer of LinuxAI, an operating system where an AI does the work and the human steers by commenting on any step of it.
Below is one task as a graph of steps (intent → reasoning → decisions → actions → results); "from" lists each step's upstream steps.
The human just commented on step "${n.id}".

Decide what the comment means:
- "question": they want an explanation. Answer from the evidence and change nothing.
- "change": it corrects a fact or overrides a choice. Revise the commented step if it changes, and every step downstream whose content depends on it. If the comment shows an earlier assumption was wrong, revise those upstream steps too. Leave unaffected steps out.
- "lesson": they are teaching a better way to reason (a factor to weigh, an exception to a rule, a different way to think about the trade-off). Re-run this task's reasoning with it, revising affected steps (this task may or may not change), AND state it as a reusable principle for future decisions.
- "note": a lasting preference or fact to remember, with no change to this task.
Apply the human's existing principles (listed below) whenever they are relevant.

Write as the AI speaking plainly to the human, short. Keep step ids. Invent realistic specifics (times, prices, names) consistent with the task when a revision needs them. A revised step that is not yet carried out stays a proposal; revised actions that cost money still need the human's approval.

Reply with only JSON, no other text:
{"kind":"question|change|lesson|note","reply":"what you say back (1-3 sentences)","remember":"a lasting preference learned, or empty string","principle":{"text":"for a lesson: the principle in one sentence, as an instruction to yourself","scope":"short area it applies to, e.g. freight, travel, bills"},"revisions":[{"id":"step id","title":"new short title","summary":"new 1-2 sentence summary","why":"one line: what changed and why","confidence":0.0,"options":[{"label":"...","score":0.0,"chosen":true,"why":"..."}]}]}
"options" only for decisions; omit fields that don't change. "revisions" is [] for a question or note; "principle" is null unless kind is lesson.

THE HUMAN'S PRINCIPLES (learned earlier):
${principles.map((p) => "- [" + p.scope + "] " + p.text).join("\n")}

TASK:
${JSON.stringify(compactTask(t))}

EARLIER DISCUSSION ON THIS STEP:
${(n.comments || []).map((c) => (c.who === "you" ? "Human: " : "AI: ") + c.text).join("\n") || "(none)"}

COMMENT ON STEP ${n.id}: ${comment}`;
}

function scripted(t, n, comment) {
  if (/\?\s*$/.test(comment)) {
    const ev = n.evidence?.[0];
    return { kind: "question", reply: ev ? `Mostly from ${ev[0]}: ${ev[1]}. ${n.summary}` : n.summary, remember: "", revisions: [] };
  }
  if (/\b(consider|think about|factor|weigh|remember that|always|never|in general|when .* then|unless)\b/i.test(comment)) {
    return { kind: "lesson", reply: `That's a useful way to think about it. I'll weigh it here and, if you keep it, in future ${t.id === "load" ? "freight" : "similar"} decisions.`, remember: "",
      principle: { text: comment.replace(/^./, (c) => c.toUpperCase()), scope: t.id === "load" ? "freight" : "general" },
      revisions: [{ id: n.id, why: "Re-weighed with your principle." }] };
  }
  const down = reach(t, n.id, "down").map((id) => node(t, id)).filter((x) => x.status !== "done" || x.kind !== "intent");
  return { kind: "change", reply: `Got it. I'll re-plan from here with “${comment}”. In the live system I'd work out the new specifics; this demo just marks what would change.`,
    remember: "", revisions: [n, ...down].map((x) => ({ id: x.id, summary: `Re-planned using your note: “${comment}”.`, why: x.id === n.id ? "You changed this directly." : `Depends on “${n.title}”.` })) };
}

async function sendComment(text) {
  const t = task(), n = node(t, selected);
  n.comments = [...(n.comments || []), { who: "you", text }];
  pending = null;
  const ctl = new AbortController();
  thinking = { nodeId: n.id, taskId: t.id, ctl };
  render();
  let result;
  try {
    if (!sampleFn) throw { code: "unavailable" };
    result = await sampleFn.json(promptFor(t, n, text), { signal: ctl.signal, cache: false });
    if (!result || typeof result.reply !== "string") throw { code: "invalid_json" };
    if (!result.principle || typeof result.principle.text !== "string" || !result.principle.text.trim()) result.principle = null;
    result.revisions = Array.isArray(result.revisions) ? result.revisions.filter((r) => r && node(t, String(r.id))) : [];
  } catch (e) {
    if (e && e.code === "cancelled") { thinking = null; n.comments.push({ who: "ai", text: "(stopped)" }); render(); return; }
    if (e && (e.code === "not_granted" || e.code === "sampling_disabled")) { sampleFn = null; }
    result = scripted(t, n, text);
    if (e && e.code && e.code !== "unavailable") result.reply += ` (Claude couldn't answer: ${e.code}.)`;
  }
  thinking = null;
  n.comments.push({ who: "ai", text: result.reply + (result.remember ? `\n\nI'll remember: ${result.remember}` : "") });
  if (result.revisions.length || result.principle?.text) pending = { taskId: t.id, nodeId: n.id, comment: text, result };
  current = t.id; selected = n.id;
  render();
}

function keepLesson() {
  const p = pending?.result.principle;
  if (!p?.text || !$("keepLesson")?.checked) return;
  principles.forEach((x) => delete x.isNew);
  const id = "p" + Date.now().toString(36);
  principles.unshift({ id, text: String(p.text), scope: String(p.scope || "general"), from: "Your comment just now", uses: 0, isNew: true });
  const n = node(task(), pending.nodeId); if (n) n.applied = [...(n.applied || []), id];
}

function applyPending(targetTask) {
  for (const rv of pending.result.revisions) {
    const n = node(targetTask, rv.id); if (!n) continue;
    if ((rv.title && rv.title !== n.title) || (rv.summary && rv.summary !== n.summary)) n.history = [...(n.history || []), { title: n.title, after: pending.comment }];
    if (rv.title) n.title = rv.title;
    if (rv.summary) n.summary = rv.summary;
    if (typeof rv.confidence === "number") n.conf = Math.max(0, Math.min(1, rv.confidence));
    if (Array.isArray(rv.options) && rv.options.length) n.options = rv.options.map((o) => ({ label: String(o.label), score: Number(o.score) || 0, chosen: !!o.chosen, why: String(o.why || "") }));
    if (n.kind === "action" || n.kind === "result") n.status = "waiting";
    else if (n.status !== "waiting") n.status = "done";
  }
  targetTask.status = targetTask.nodes.some((n) => n.status === "waiting") ? "waiting" : "done";
}

// ---------------------------------------------------------------------------------------------
// Events
// ---------------------------------------------------------------------------------------------
document.addEventListener("click", (e) => {
  const tk = e.target.closest("[data-task]");
  if (tk) { current = tk.dataset.task; selected = task().nodes.find((n) => n.kind === "decision")?.id || task().nodes[0].id; render(); return; }
  const nd = e.target.closest("[data-node]");
  if (nd) { selected = nd.dataset.node; renderGraph(); renderInspector(); return; }
  const ap = e.target.closest("[data-approve]");
  if (ap) {
    const t = task(), n = node(t, ap.dataset.approve);
    n.status = "done"; n.comments = [...(n.comments || []), { who: "ai", text: "Approved. Done, and recorded in the journal." }];
    for (const c of reach(t, n.id, "down")) node(t, c).status = "done";
    t.status = t.nodes.some((x) => x.status === "waiting") ? "waiting" : "done";
    render(); return;
  }
  const rp = e.target.closest("[data-reply]");
  if (rp) {
    const t = task(), n = node(t, rp.dataset.reply), choice = n.reach.opts[+rp.dataset.i];
    n.status = "done";
    n.comments = [...(n.comments || []), { who: "you", text: choice }, { who: "ai", text: `Got it: ${choice}. Continuing from here.` }];
    for (const c of reach(t, n.id, "down")) { const x = node(t, c); if (x.status === "waiting" && !x.reach) x.status = "done"; }
    t.status = t.nodes.some((x) => x.status === "waiting") ? "waiting" : "done";
    render(); return;
  }
  const dc = e.target.closest("[data-decline]");
  if (dc) { const n = node(task(), dc.dataset.decline); n.comments = [...(n.comments || []), { who: "ai", text: "OK, holding off. Comment here if you want me to change the plan." }]; renderInspector(); return; }
  if (e.target.id === "stop" && thinking) { thinking.ctl.abort(); return; }
  if (e.target.id === "apply" && pending) { keepLesson(); applyPending(task()); pending = null; render(); return; }
  if (e.target.id === "discard" && pending) { pending = null; render(); return; }
  if (e.target.id === "branch" && pending) {
    const src = task(), copy = JSON.parse(JSON.stringify(src));
    copy.id = src.id + "-b" + Date.now().toString(36); copy.title = src.title + " (branch)"; copy.when = "now";
    keepLesson(); applyPending(copy); tasks.splice(tasks.indexOf(src) + 1, 0, copy);
    pending = null; current = copy.id; render(); return;
  }
});

document.addEventListener("submit", (e) => {
  if (e.target.id !== "composer") return;
  e.preventDefault();
  const text = $("cmt").value.trim();
  if (text && !thinking) sendComment(text);
});
document.addEventListener("keydown", (e) => {
  if (e.target.id === "cmt" && e.key === "Enter" && (e.metaKey || e.ctrlKey)) { e.preventDefault(); $("composer").requestSubmit(); }
});

render();
(async () => {
  try { sampleFn = window.claude ? await window.claude.use("sample") : null; } catch { sampleFn = null; }
  $("mode").textContent = sampleFn ? "prototype · example data · live reasoning" : "prototype · example data";
  renderInspector();
})();
</script>
