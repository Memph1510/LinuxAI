# LinuxAI's screen. Hyprland draws it; the AI drives it through the compositor organ (linuxai-core compositor).
# Not a desktop: one place where the work (the session, pages, pictures) appears and the AI arranges it.

monitor = , preferred, auto, 1

# Bring the session environment to the user services, then start the LinuxAI parts.
exec-once = systemctl --user import-environment WAYLAND_DISPLAY HYPRLAND_INSTANCE_SIGNATURE XDG_CURRENT_DESKTOP
exec-once = systemctl --user restart linuxai-browser   # now on screen, not headless
exec-once = /usr/local/bin/linuxai-core compositor
exec-once = quickshell -p /etc/linuxai/quickshell/shell.qml
exec-once = foot --title LinuxAI /usr/local/bin/linuxai-session

env = XDG_CURRENT_DESKTOP,Hyprland
env = XCURSOR_SIZE,24

general {
    gaps_in = 6
    gaps_out = 10
    border_size = 2
    col.active_border = rgb(46c2c9)
    col.inactive_border = rgb(233140)
    layout = dwindle
}
decoration {
    rounding = 8
    blur { enabled = true }
}
animations { enabled = true }
misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    background_color = rgb(0b1016)
}
input { kb_layout = us }

# A few keys while there's no voice or Workspace screen yet.
$mod = SUPER
bind = $mod, Return, exec, foot /usr/local/bin/linuxai-session
bind = $mod, Q, killactive
bind = $mod, F, fullscreen
bind = $mod, left, movefocus, l
bind = $mod, right, movefocus, r
bind = $mod, up, movefocus, u
bind = $mod, down, movefocus, d
