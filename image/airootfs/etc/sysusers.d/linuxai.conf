# LinuxAI's accounts (independent review C1, issue #22).
#  linuxai      the human (made by the image build)
#  linuxai-ai   the AI's own account: no sudo, no login, no session, not in the human's group, so nothing it runs is
#               the human or root. The background AI (linuxai-mind.service) runs as it.
#  linuxai-core the core's own account (review M4): never root. What needs root goes through systemd, which polkit
#               allows this account only (/etc/polkit-1/rules.d/50-linuxai-core.rules). Its group is everyone who may talk
#               to the core and the shared organs (the core checks which of them is talking).
#  linuxai-mail the mail organ: it reads email from strangers, so it runs on its own, with nothing else.
u linuxai-ai - "LinuxAI's own account (the AI)" /var/lib/linuxai-ai /usr/bin/nologin
u linuxai-core - "LinuxAI core" /var/lib/linuxai /usr/bin/nologin
u linuxai-mail - "LinuxAI mail organ" /var/lib/linuxai-mail /usr/bin/nologin
m linuxai-mail linuxai-core
# The core writes the human's playbooks (their group) and reads the system journal.
m linuxai-core linuxai
m linuxai-core systemd-journal
m linuxai linuxai-core
m linuxai-ai linuxai-core
# Reading the system journal, as the AI did before (read-only).
m linuxai-ai systemd-journal
# The human can open what the background AI makes (pictures, 3D, files) in /var/lib/linuxai-ai.
m linuxai linuxai-ai
