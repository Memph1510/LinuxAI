# The human's playbooks and prompt library: theirs to read and edit.
d /home/linuxai/playbooks 2775 linuxai linuxai -
Z /home/linuxai/prompts - linuxai linuxai -
# Local models (linuxai-core models fetch), read by the local model server.
d /var/lib/linuxai/models 0755 root root -
# The organs the AI shares with the human (browser, screen, craft, a running Blender) listen here, so the AI's own
# account can reach them; the core and organs check who is connecting (review C1).
d /run/linuxai-organs 2770 root linuxai-core -
