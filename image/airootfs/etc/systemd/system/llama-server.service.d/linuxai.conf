# LinuxAI: the local model server, for jobs set to "local:<name>" (e.g. reading email). It answers only on this
# machine (the extractor also refuses any other address), and loads a model from /var/lib/linuxai/models by name
# when a job first asks for it. Models are fetched and checked with: sudo linuxai-core models fetch qwen3-4b
[Service]
ExecStart=
ExecStart=/usr/bin/llama-server --host 127.0.0.1 --port 8080 --models-dir /var/lib/linuxai/models --ctx-size 8192
