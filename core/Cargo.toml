[package]
name = "linuxai-core"
version = "0.1.0"
edition = "2021"
description = "LinuxAI core: action-language engine, memory, Linux host organ, rules and local API"
license = "Apache-2.0"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }

[profile.release]
opt-level = 3
lto = "thin"
strip = true
